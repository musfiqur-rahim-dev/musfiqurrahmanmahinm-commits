<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Black Shadow Team — Cyberpunk Banner</title>
  <desc id="desc">Dark cyberpunk banner with glowing cyan and violet neon borders and Black Shadow Team branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#160922"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#00f5ff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M0 278H1200M0 292H1200" stroke="#8b5cf6" stroke-opacity=".18"/>
  <circle cx="1010" cy="92" r="130" fill="#8b5cf6" opacity=".08"/>
  <circle cx="1020" cy="92" r="75" fill="#00f5ff" opacity=".06"/>
  <rect x="12" y="12" width="1176" height="336" rx="22" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  <path d="M40 56h110M1050 304h110" stroke="#00f5ff" stroke-width="3" filter="url(#glow)"/>
  <text x="600" y="143" text-anchor="middle" fill="#f5f7ff" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="7">MUSFIQUR RAHIM</text>
  <text x="600" y="205" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="3">CEO &amp; FOUNDER</text>
  <text x="600" y="253" text-anchor="middle" fill="#00f5ff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="5" filter="url(#glow)">BLACK SHADOW TEAM</text>
  <text x="600" y="316" text-anchor="middle" fill="#b7c3d7" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4">TURNING IDEAS INTO IMPACT</text>
</svg>
